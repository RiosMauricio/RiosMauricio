name: snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2563eb&color_dots=#ebedf0,#bfdbfe,#60a5fa,#2563eb,#1e3a8a
            dist/snake-dark.svg?palette=github-dark&color_snake=#f472b6&color_dots=#161b22,#0e3a5c,#1e6fa8,#63b3ed,#22d3ee

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
